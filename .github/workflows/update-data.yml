name: Update talent data

on:
  schedule:
    # 05:20 UTC daily. archon's own aggregates settle overnight, so an early-morning run
    # picks up a full previous day.
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scrape parses.gg + archon.gg
        run: node tools/scrape.mjs --source both --concurrency 6

      - name: Check generated Lua parses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          for f in src/Data/*.lua src/Api/Api.lua; do
            luac5.1 -p "$f"
            echo "ok: $f"
          done

      - name: Check generated data is sane
        run: node tools/verify.mjs

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/Data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes; skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        id: commit
        run: |
          VERSION="$(date -u +%Y.%m.%d)"
          sed -i "s/^## Version:.*/## Version: ${VERSION}/" ArchonTalentsData.toc
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/Data tools/last-run.json ArchonTalentsData.toc
          git commit -m "data: archon.gg builds for ${VERSION}"
          git push
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package addon
        if: steps.diff.outputs.changed == 'true'
        run: |
          # WowUp installs the folder found at the root of the zip, so the addon files must sit
          # under a directory named exactly as the addon. Build tooling stays out of the zip.
          mkdir -p dist/ArchonTalentsData
          cp -r src ArchonTalentsData.toc dist/ArchonTalentsData/
          cd dist
          zip -qr ArchonTalentsData.zip ArchonTalentsData
          unzip -l ArchonTalentsData.zip

      - name: Release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.commit.outputs.version }}"
          # A manual re-run on the same day reuses the day's tag rather than failing on it.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/ArchonTalentsData.zip --clobber
          else
            gh release create "v${VERSION}" dist/ArchonTalentsData.zip \
              --title "v${VERSION}" \
              --notes "Talent builds scraped from archon.gg on ${VERSION}." \
              --latest
          fi
